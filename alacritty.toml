  [window]
  decorations = "None"
  opacity = 0.6

  [font]
  normal = {family = " Noto Sans Mono", style = "Regular"}
  size = 9


  [colors.primary]
  background = "#000000"
  foreground = "#ffffff"

  [colors.normal]
  black   = "#000000"
  red     = "#e92f2f"
  green   = "#0ed839"
  yellow  = "#fbfbb1"
  blue    = "#4ba3ff"
  magenta = "#f996e2"
  cyan    = "#62ffe7"
  white   = "#ababab"

  [colors.bright]
  black   = "#343434"
  red     = "#e92f2f"
  green   = "#0ed839"
  yellow  = "#fbfbd0"
  blue    = "#5eacff"
  magenta = "#f996e2"
  cyan    = "#23edda"
  white   = "#f9f9f9"

  [colors.selection]
  text = "#ffffff"
  background = "#009900"